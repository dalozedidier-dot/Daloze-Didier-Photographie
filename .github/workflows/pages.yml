name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare social sharing image
        run: |
          echo "--- SOURCE IMAGE ---"
          file assets/og-image.jpg
          cp assets/og-image.jpg assets/partage-didier-daloze-20260906.jpg
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          html = p.read_text(encoding='utf-8')
          old = 'https://dalozedidier-dot.github.io/Daloze-Didier-Photographie/assets/og-image.jpg'
          new = 'https://dalozedidier-dot.github.io/Daloze-Didier-Photographie/assets/partage-didier-daloze-20260906.jpg'
          html = html.replace(old, new)
          html = html.replace('<meta property="og:image:width" content="1200">', '<meta property="og:image:width" content="1733">')
          html = html.replace('<meta property="og:image:height" content="630">', '<meta property="og:image:height" content="907">')
          p.write_text(html, encoding='utf-8')
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify Facebook crawler access
        run: |
          sleep 5
          FB_UA='facebookexternalhit/1.1 (+http://www.facebook.com/externalhit_uatext.php)'
          SITE='https://dalozedidier-dot.github.io/Daloze-Didier-Photographie/'
          IMG='https://dalozedidier-dot.github.io/Daloze-Didier-Photographie/assets/partage-didier-daloze-20260906.jpg'
          echo '--- FACEBOOK PAGE HEADERS ---'
          curl -A "$FB_UA" -sSIL --max-time 20 "$SITE" | sed -n '1,25p'
          echo '--- FACEBOOK SEES THESE OG TAGS ---'
          curl -A "$FB_UA" -sS --max-time 20 "$SITE" | grep -E 'og:(title|description|url|image)|twitter:image'
          echo '--- FACEBOOK IMAGE HEADERS ---'
          curl -A "$FB_UA" -sSIL --max-time 20 "$IMG" | sed -n '1,30p'
