name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare social sharing image
        run: |
          echo "--- SOURCE IMAGE ---"
          file assets/og-image.jpg
          cp assets/og-image.jpg assets/partage-didier-daloze-20260906.jpg
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          html = p.read_text(encoding='utf-8')
          old = 'https://dalozedidier-dot.github.io/Daloze-Didier-Photographie/assets/og-image.jpg'
          new = 'https://dalozedidier-dot.github.io/Daloze-Didier-Photographie/assets/partage-didier-daloze-20260906.jpg'
          html = html.replace(old, new)
          html = html.replace('<meta property="og:image:width" content="1200">', '<meta property="og:image:width" content="1733">')
          html = html.replace('<meta property="og:image:height" content="630">', '<meta property="og:image:height" content="907">')
          p.write_text(html, encoding='utf-8')
          PY
          echo "--- DEPLOYED OG TAGS ---"
          grep -E 'og:image|twitter:image' index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify published social preview files
        run: |
          sleep 5
          echo "--- LIVE OG TAGS ---"
          curl -sS --max-time 20 https://dalozedidier-dot.github.io/Daloze-Didier-Photographie/ | grep -E 'og:image|twitter:image'
          echo "--- NEW IMAGE HEADERS ---"
          curl -sSIL --max-time 20 https://dalozedidier-dot.github.io/Daloze-Didier-Photographie/assets/partage-didier-daloze-20260906.jpg | sed -n '1,30p'
